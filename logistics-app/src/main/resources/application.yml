# The chassis (ff-base-app) brings the shared defaults: health groups, probes, virtual threads,
# schema validation. Only what is particular to this application is here.
server:
  port: 8081

spring:
  application:
    name: logistics-app
  # The defaults reach the cluster's PostgreSQL through NodePort 5432, so a run from the IDE needs
  # no settings. In the cluster the chart sets LOGISTICS_DB_* from the postgres Secret.
  datasource:
    url: ${LOGISTICS_DB_URL:jdbc:postgresql://localhost:5432/ff_logistics}
    username: ${LOGISTICS_DB_USERNAME:fflogistics}
    password: ${LOGISTICS_DB_PASSWORD:fflogisticsDb2026}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are checked here, against the keys the identity service publishes: this process
          # never calls Keycloak. issuer-uri is the iss every token must carry (Keycloak's public
          # address), not a discovery URL. The defaults fit a run from the IDE.
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8085/jwks}
          issuer-uri: ${IDENTITY_TOKEN_ISSUER:http://localhost:8180/realms/ff-logistics}
          audiences: ff-logistics-api

ff:
  # Documents (ff-base-storage, S05-05): the e-CMR and the proof of delivery, written once, through
  # presigned links. reference-only reserves locations and answers links with 503; s3 is RustFS in
  # the cluster, or its host port from the IDE.
  storage:
    provider: ${STORAGE_PROVIDER:reference-only}
    bucket: ff-documents
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
      # Where links point, when it differs from the endpoint: in the cluster the application
      # reaches rustfs-svc:9000, a name a client outside cannot resolve.
      public-endpoint: ${STORAGE_S3_PUBLIC_ENDPOINT:}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      timeout: PT5S
  security:
    header-fallback:
      # Local development only, switched on by the "local" profile (application-local.yml).
      enabled: false
  # This process's outbox (ff-base-events, decision 12): the event publication registry in the
  # schema "modulith", migrated with the areas. The events between areas stay in this JVM.
  events:
    schema: modulith
  # The routing area's planner. Road distances come from the straight-line estimate (haversine x
  # 1.24) unless ROUTING_ROAD_MATRIX=osrm and an OSRM server is named; the cluster runs none. Longer
  # routes, and any with a time window, are ordered by Timefold within the solver limits.
  routing:
    road-matrix: ${ROUTING_ROAD_MATRIX:haversine}
    osrm:
      base-url: ${ROUTING_OSRM_URL:http://localhost:5000}
    max-stops: 99
    nearest-neighbour-max-stops: 8
    solver-limit: PT1S
    solver-unimproved-limit: PT0.2S
