# Test overrides. Spring Boot reads classpath:/application.yml (src/main/resources) first and then
# classpath:/config/application.yml (this file), which wins where both set a value. So the tests run
# with the real settings and change the database (an in-memory one, migrated by the same
# area migrations as PostgreSQL) and keep Kafka out unless a test asks for it.
spring:
  datasource:
    url: jdbc:h2:mem:logistics;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Most tests need no broker: the events stay in this JVM. EventsToKafkaTest turns externalization
  # on, with a broker in the test JVM; elsewhere no topic is created on a broker that is not there.
  modulith:
    events:
      externalization:
        enabled: false
  kafka:
    admin:
      auto-create: false
